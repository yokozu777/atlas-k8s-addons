# Orphaned reference playbook (not imported by 610_elasticsearch_prepare).
# Kept for manual cert experiments; must remain valid YAML for ansible-lint.
###########################################################################################################################################
### ELASTIC USER PASSWORD
###########################################################################################################################################

    - name: elastic-credentials secret
      kubernetes.core.k8s:
        state: present
        definition: 
          apiVersion: v1
          kind: Secret            
          metadata:
            name: elastic-credentials
            namespace: "{{ logging_namespace }}"
          type: Opaque
          data:
            password: "{{ k8s_secrets.elastic_password | b64encode }}"
            username: "{{ 'elastic' | b64encode }}"

###########################################################################################################################################
### KIBANA ENCRYPTION KEY
###########################################################################################################################################

    - name: kibana encryption secret
      kubernetes.core.k8s:
        state: present
        definition: 
          apiVersion: v1
          kind: Secret            
          metadata:
            name: kibana
            namespace: "{{ logging_namespace }}"
          type: Opaque
          data:
            encryptionkey: c29tZXRoaW5nX2F0X2xlYXN0XzMyX2NoYXJhY3RlcnM=

###########################################################################################################################################
### ELASTIC TRUSTORE&KEYSTORE PASSWORDS
###########################################################################################################################################

    - name: elastic-certificates-password
      kubernetes.core.k8s:
        state: present
        definition: 
          apiVersion: v1
          kind: Secret           
          metadata:
            name: elastic-certificates-password
            namespace: "{{ logging_namespace }}"
          type: Opaque            
          data:
            xpack.security.http.ssl.keystore.secure_password: "{{ k8s_secrets.elastic_cert_password | b64encode }}"
            xpack.security.http.ssl.truststore.secure_password: "{{ k8s_secrets.elastic_cert_password | b64encode }}"
            xpack.security.transport.ssl.keystore.secure_password: "{{ k8s_secrets.elastic_cert_password | b64encode }}"
            xpack.security.transport.ssl.truststore.secure_password: "{{ k8s_secrets.elastic_cert_password | b64encode }}"

###########################################################################################################################################
### ELASTIC CREATE CA PRIVATE KEY
###########################################################################################################################################

    - name: Generate a self-signed private key for CA elasticsearch
      community.crypto.openssl_privatekey:
        return_content: true      
        path: "{{ k8s_manifests_dir }}/cluster_ca.key"
        # size: 4096
        # mode: 0755
        # type: RSA
        state: present
      no_log: True        
      register: private_key_ca

###########################################################################################################################################
### ELASTIC CREATE CA CSR
###########################################################################################################################################

    - name: Create CSR for self-signed certificate CA elasticsearch
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ k8s_manifests_dir }}/cluster_ca.key"
        common_name: "{{ elasticsearch_host }}"
        use_common_name_for_san: false  # since we do not specify SANs, don't use CN as a SAN
        basic_constraints:
          - 'CA:TRUE'
        basic_constraints_critical: true
        key_usage:
          - keyCertSign
        key_usage_critical: true		
      register: csr_ca
      no_log: True

###########################################################################################################################################
### ELASTIC CREATE CA PUB
###########################################################################################################################################

    - name: Generate a self-signed certificate CA elasticsearch
      community.crypto.x509_certificate:
        return_content: true      
        path: "{{ k8s_manifests_dir }}/cluster_ca.crt"
        privatekey_path: "{{ k8s_manifests_dir }}/cluster_ca.key"
        csr_content: "{{ csr_ca.csr }}"
        provider: selfsigned
        selfsigned_not_after: "+3650d"
        # mode: 0777    
      register: public_key_ca 

###########################################################################################################################################
### ELASTIC CREATE PRIVATE KEY
###########################################################################################################################################

    - name: Generate a self-signed private key for elasticsearch
      community.crypto.openssl_privatekey:
        return_content: true      
        path: "{{ k8s_manifests_dir }}/elasticsearch.key"
        state: present
      no_log: True        
      register: private_key_es

###########################################################################################################################################
### ELASTIC CREATE CSR
###########################################################################################################################################

    - name: Create CSR for self-signed certificate elasticsearch
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ k8s_manifests_dir }}/elasticsearch.key"
        common_name: elasticsearch-master
        # organization_name: contoso, Inc.
        subject_alt_name:
          - "DNS:elasticsearch-master"
      register: csr_es
      no_log: True      

###########################################################################################################################################
### ELASTIC CREATE PUB 
###########################################################################################################################################

    - name: Sign certificate with our CA
      community.crypto.x509_certificate_pipe:
        csr_content: "{{ csr_es.csr }}"
        provider: ownca
        ownca_path: "{{ k8s_manifests_dir }}/cluster_ca.crt"
        ownca_privatekey_path: "{{ k8s_manifests_dir }}/cluster_ca.key"
        #ownca_privatekey_passphrase: "{{ secret_ca_passphrase }}"
        ownca_not_after: +365d  # valid for one year
        ownca_not_before: "-1d"  # valid since yesterday
      run_once: true
      register: public_key_es

###########################################################################################################################################
### ELASTIC STORE CERT
###########################################################################################################################################

    - name: store es cert
      ansible.builtin.copy:
        dest: "{{ k8s_manifests_dir }}/elasticsearch.crt"
        content: "{{ public_key_es.certificate }}"
        
###########################################################################################################################################
### ELASTIC CREATE KEYSTORE
###########################################################################################################################################

    - name: Generate PKCS#12 file
      community.crypto.openssl_pkcs12:
        return_content: true
        passphrase: "random"
        action: export
        path: "{{ k8s_manifests_dir }}/elastic.p12"
        friendly_name: elastic
        privatekey_path: "{{ k8s_manifests_dir }}/elasticsearch.key"
        certificate_path: "{{ k8s_manifests_dir }}/elasticsearch.crt"
        other_certificates: "{{ k8s_manifests_dir }}/cluster_ca.crt"
        # Note that if /opt/certs/ca.pem contains multiple certificates,
        # only the first one will be used. See the other_certificates_parse_all
        # option for changing this behavior.
        state: present
      register: elastic_p12

