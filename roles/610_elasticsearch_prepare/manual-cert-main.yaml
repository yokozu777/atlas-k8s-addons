###########################################################################################################################################
### ELASTIC CREATE TRUSTORE&KEYSTORE
###########################################################################################################################################

    - name: elastic secret
      k8s:
        state: present
        namespace: "{{ logging_namespace }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: elastic-certificates
          type: Opaque                    
          data:
            elastic.p12:  "{{ elastic_p12.pkcs12 }}"
            elastic_ca.p12:  "{{ elastic_ca_p12.content }}"
            ca.crt:  "{{ public_key_ca.certificate | b64encode }}" 
            tls.crt:  "{{ public_key_es.certificate | b64encode }}" 
            tls.key:  "{{ private_key_es.privatekey | b64encode }}"

    - name: Helming
      command: "helm upgrade --install {{ item }} --create-namespace --set imageTag={{ ESimageTag }} {{ elasticsearch_chart_version | helm_chart_version_args }}"
      loop:
        - elasticsearch elastic/elasticsearch --namespace {{ logging_namespace }} -f {{ k8s_manifests_dir }}/elastic.yaml #--version 8.5.1

    - name: Wait for the Elastic to be up
      ansible.builtin.uri:
        url: "https://{{ elasticsearch_host }}"
        method: GET
        return_content: false
        status_code: 401
        validate_certs: false
      register: result
      retries: 1000
      delay: 5
      until: result.status == 401

    - name: post to elastic logger user
      ansible.builtin.uri:
        validate_certs: false
        url: "https://{{ elasticsearch_host }}/_security/user/{{ k8s_users.elastic_logger }}?pretty"
        method: POST
        url_username: "{{ k8s_users.elastic_superuser }}"
        url_password: "{{ k8s_secrets.elastic_password }}"
        force_basic_auth: true
        body:
          password: "{{ k8s_secrets.elastic_logger_password }}"
          roles: ["superuser"]
        body_format: json
        headers:
          Content-Type: "application/json"
      no_log: true

    - name: post to elastic admin user
      ansible.builtin.uri:
        validate_certs: false
        url: "https://{{ elasticsearch_host }}/_security/user/{{ k8s_users.elastic_admin }}?pretty"
        method: POST
        url_username: "{{ k8s_users.elastic_superuser }}"
        url_password: "{{ k8s_secrets.elastic_password }}"
        force_basic_auth: true
        body:
          password: "{{ k8s_secrets.elastic_admin_password }}"
          roles: ["superuser"]
        body_format: json
        headers:
          Content-Type: "application/json"
      no_log: true        