---
- name: Assert kubectl secret parameters are defined
  ansible.builtin.assert:
    that:
      - k8s_kubectl_secret_name | default('') | length > 0
      - k8s_kubectl_secret_namespace | default('') | length > 0
      - k8s_kubectl_secret_from_dir | default('') | length > 0
    fail_msg: >-
      Cannot apply Kubernetes secret{{ (': ' ~ k8s_kubectl_secret_failure_context) if (k8s_kubectl_secret_failure_context | default('') | length > 0) else '' }}:
      secret name, namespace, or source directory is missing.

- name: Ensure Kubernetes secret from staged directory
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl -n {{ k8s_kubectl_secret_namespace | quote }} create secret generic {{ k8s_kubectl_secret_name | quote }} \
      --from-file={{ k8s_kubectl_secret_from_dir | quote }} \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ controller_kubeconfig }}"
  register: k8s_kubectl_secret_apply
  changed_when: >-
    'created' in k8s_kubectl_secret_apply.stdout
    or 'configured' in k8s_kubectl_secret_apply.stdout
