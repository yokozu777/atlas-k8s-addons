---
- name: Assert control-plane SSH fetch target is defined
  ansible.builtin.assert:
    that:
      - k8s_control_plane_master_host | default('') | length > 0
      - k8s_control_plane_fetch_dest_dir | default('') | length > 0
      - k8s_control_plane_fetch_remote_files | default([]) | length > 0
    fail_msg: >-
      Cannot fetch control-plane files{{ (': ' ~ k8s_control_plane_fetch_failure_context) if (k8s_control_plane_fetch_failure_context | default('') | length > 0) else '' }}:
      inventory group named by k8s_master_hosts={{ k8s_master_hosts | default('k8s_masters') }}
      is empty or fetch parameters are incomplete.

- name: Ensure controller directories exist for control-plane file fetch
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - "{{ k8s_control_plane_fetch_dest_dir }}"
    - "{{ k8s_control_plane_scripts_dir }}"

- name: Build SSH argv prefix for control-plane access
  ansible.builtin.set_fact:
    k8s_control_plane_ssh_argv_prefix: >-
      {{
        [
          'ssh',
          '-o', 'BatchMode=yes',
          '-o', 'ConnectTimeout=30',
          '-o', 'StrictHostKeyChecking=no',
          '-o', 'UserKnownHostsFile=/dev/null',
        ]
        + (
          ['-i', k8s_control_plane_ssh_private_key_file]
          if (k8s_control_plane_ssh_private_key_file | default('') | length > 0)
          else []
        )
        + (k8s_control_plane_ssh_extra_args | default([]))
      }}

- name: Verify remote control-plane files exist
  ansible.builtin.command:
    argv: >-
      {{
        k8s_control_plane_ssh_argv_prefix
        + [
          k8s_control_plane_ssh_target,
          'sudo',
          'test',
          '-f',
          item.remote,
        ]
      }}
  loop: "{{ k8s_control_plane_fetch_remote_files }}"
  loop_control:
    label: "{{ item.remote }}"
  register: k8s_control_plane_fetch_remote_checks
  changed_when: false
  failed_when: false

- name: Fail when remote control-plane files are missing
  ansible.builtin.fail:
    msg: >-
      {{ item.item.remote }} is missing on {{ k8s_control_plane_master_host }}.
      {{ k8s_control_plane_fetch_missing_hint | default('Ensure kubeadm has initialized etcd PKI on the control-plane node.') }}
  when: item.rc != 0
  loop: "{{ k8s_control_plane_fetch_remote_checks.results }}"
  loop_control:
    label: "{{ item.item.remote }}"

- name: Render control-plane file fetch script on controller
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/fetch_control_plane_files.sh.j2"
    dest: "{{ k8s_control_plane_fetch_script }}"
    mode: '0700'

- name: Fetch control-plane files from first control-plane node via SSH
  ansible.builtin.shell: |
    set -euo pipefail
    dest_dir={{ k8s_control_plane_fetch_dest_dir | quote }}
    before_checksum=""
    if [[ -d "${dest_dir}" ]]; then
      before_checksum="$(
        find "${dest_dir}" -type f -print0 \
          | sort -z \
          | xargs -0 sha256sum 2>/dev/null \
          | sha256sum \
          | awk '{print $1}'
      )"
    fi
    {{ k8s_control_plane_fetch_script | quote }}
    after_checksum="$(
      find "${dest_dir}" -type f -print0 \
        | sort -z \
        | xargs -0 sha256sum 2>/dev/null \
        | sha256sum \
        | awk '{print $1}'
    )"
    if [[ "${before_checksum}" != "${after_checksum}" ]]; then
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: k8s_control_plane_fetch_run
  changed_when: "'CHANGED' in k8s_control_plane_fetch_run.stdout"

- name: Stat staged control-plane files after fetch
  ansible.builtin.stat:
    path: "{{ k8s_control_plane_fetch_dest_dir }}/{{ item.local | default(item.remote | basename) }}"
  loop: "{{ k8s_control_plane_fetch_remote_files }}"
  loop_control:
    label: "{{ item.local | default(item.remote | basename) }}"
  register: k8s_control_plane_fetch_staged_files

- name: Assert staged control-plane files are non-empty
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false) | bool
      - item.stat.size | default(0) | int > 0
    fail_msg: >-
      Staged file {{ item.item.local | default(item.item.remote | basename) }} is missing or empty
      under {{ k8s_control_plane_fetch_dest_dir }} after SSH fetch.
  loop: "{{ k8s_control_plane_fetch_staged_files.results }}"
  loop_control:
    label: "{{ item.item.local | default(item.item.remote | basename) }}"
