---
- name: Assert cluster credentials report mode is valid
  ansible.builtin.assert:
    that:
      - cluster_credentials_mode | default('full') in ['full', 'summary']
    fail_msg: >-
      cluster_credentials_mode must be full or summary
      (got {{ cluster_credentials_mode | default('full') }})

- name: Assert cluster credentials export paths stay under controller reports dir
  ansible.builtin.assert:
    that:
      - cluster_credentials_file | default(controller_reports_dir ~ '/cluster-credentials.yaml') is match('^' ~ controller_reports_dir)
      - (cluster_credentials_md_file | default(controller_reports_dir ~ '/cluster-credentials.md')) is match('^' ~ controller_reports_dir)
      - controller_reports_dir is match('^' ~ controller_workspace)
    fail_msg: >-
      cluster_credentials_file and cluster_credentials_md_file must live under controller_reports_dir
      ({{ controller_reports_dir }}) inside controller workspace
