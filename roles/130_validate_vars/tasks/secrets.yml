---
- name: Assert required k8s_secrets keys are set
  ansible.builtin.assert:
    that:
      - k8s_secrets.grafana_admin_password | default('') | length > 0
      - k8s_secrets.keycloak_admin_password | default('') | length > 0
      - k8s_secrets.oauth2_proxy_client_secret | default('') | length > 0
      - k8s_secrets.oauth2_proxy_cookie_secret | default('') | length > 0
      - k8s_secrets.envoy_gateway_oidc_client_secret | default('') | length > 0
      - k8s_secrets.vault_oidc_client_secret | default('') | length > 0
      - k8s_secrets.argocd_oidc_client_secret | default('') | length > 0
      - k8s_secrets.pinniped_supervisor_client_secret | default('') | length > 0
      - k8s_secrets.mailu_secret_key | default('') | length > 0
      - k8s_secrets.mailu_initial_password | default('') | length > 0
      - k8s_secrets.external_dns_tsig_secret | default('') | length > 0
      - k8s_secrets.external_dns_apex_tsig_secret | default('') | length > 0
      - k8s_secrets.external_dns_istio_tsig_secret | default('') | length > 0
      - k8s_secrets.ceph_dashboard_password | default('') | length > 0
      - k8s_secrets.keycloak_oidc_user_password | default('') | length > 0
      - k8s_secrets.elastic_password | default('') | length > 0
      - k8s_secrets.elastic_cert_password | default('') | length > 0
      - k8s_secrets.elastic_logger_password | default('') | length > 0
      - k8s_secrets.elastic_admin_password | default('') | length > 0
      - k8s_secrets.elastic_jaeger_password | default('') | length > 0
      - k8s_secrets.kibana_elastic_password | default('') | length > 0
      - k8s_secrets.kibana_encryption_key | default('') | length >= 32
      - k8s_secrets.argocd_admin_password_bcrypt | default('') | length > 0
      - k8s_secrets.sentry_smtp_password | default('') | length > 0
      - k8s_secrets.alertmanager_smtp_password | default('') | length > 0
      - k8s_secrets.sentry_admin_password | default('') | length > 0
      - k8s_secrets.graylog_root_password | default('') | length > 0
      - k8s_secrets.vault_admin_password | default('') | length > 0
      - grafana_dashboards_timezone | default('') | length > 0
      - sentry_mail.host | default('') | length > 0
      - sentry_mail.username | default('') | length > 0
      - sentry_admin_email | default('') | length > 0
      - alertmanager_mail.host | default('') | length > 0
      - alertmanager_mail.from | default('') | length > 0
      - alertmanager_mail.to | default('') | length > 0
    fail_msg: "Required k8s_secrets keys missing — check group_vars/all/atlas-k8s-addons.yml"
