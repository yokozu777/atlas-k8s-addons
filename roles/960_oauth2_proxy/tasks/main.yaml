    - name: Remove {{ oauth2_proxy_namespace }} Helm chart (absent)
      when: oauth2_proxy_chart_state | default('present') == 'absent'
      ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/helm_chart_absent.yaml"
      vars:
        helm_chart_absent_releases:
          - name: oauth2-proxy
            namespace: "{{ oauth2_proxy_namespace }}"
        helm_chart_absent_delete_namespace: true
        helm_chart_absent_namespaces:
          - "{{ oauth2_proxy_namespace }}"
        helm_chart_absent_ingress_app_names:
          - oauth2-proxy
        helm_chart_absent_local_files:
          - "{{ k8s_manifests_dir }}/oauth2.yaml"
    - name: Install/configure oauth2_proxy chart
      when: oauth2_proxy_chart_state | default('present') == 'present'
      block:
        - name: Render {{ oauth2_proxy_namespace }} helm values
          ansible.builtin.template:
            src: oauth2.yaml.j2
            dest: "{{ k8s_manifests_dir }}/oauth2.yaml"
            mode: '0644'
    
        - name: Wait for Keycloak to be reachable before Helm for {{ oauth2_proxy_namespace }}
          uri:
            url: "{{ keycloak_url }}/auth/realms/master/protocol/openid-connect/token"
            method: POST
            status_code: 400
            validate_certs: no
          register: keycloak_check
          retries: 600
          delay: 3
          until: keycloak_check.status is defined and keycloak_check.status in [400, 401, 403]
    
        - name: Helming {{ oauth2_proxy_namespace }}
          command: >-
            helm upgrade --install {{ item }}
            --create-namespace
            {{ oauth2_proxy_chart_version | helm_chart_version_args }}
          loop:
            - oauth2-proxy oauth2-proxy/oauth2-proxy --namespace {{ oauth2_proxy_namespace }} -f {{ k8s_manifests_dir }}/oauth2.yaml

        - name: Render oauth2-proxy ServiceMonitor
          ansible.builtin.template:
            src: oauth2-servicemonitor.yaml.j2
            dest: "{{ k8s_manifests_dir }}/oauth2-servicemonitor.yaml"
            mode: '0644'

        - name: Apply oauth2-proxy ServiceMonitor
          ansible.builtin.command: >-
            kubectl --validate=false apply -f {{ k8s_manifests_dir }}/oauth2-servicemonitor.yaml
