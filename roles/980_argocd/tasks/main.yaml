    - name: Remove {{ argocd_namespace }} Helm chart (absent)
      when: argocd_chart_state | default('present') == 'absent'
      ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/helm_chart_absent.yaml"
      vars:
        helm_chart_absent_releases:
          - name: argocd
            namespace: "{{ argocd_namespace }}"
        helm_chart_absent_delete_namespace: true
        helm_chart_absent_namespaces:
          - "{{ argocd_namespace }}"
        helm_chart_absent_ingress_app_names:
          - argocd-server-ingress
        helm_chart_absent_local_files:
          - "{{ k8s_manifests_dir }}/argocd.yaml"
    - name: Install/configure {{ argocd_namespace }} chart
      when: argocd_chart_state | default('present') == 'present'
      block:
        ############################################################################################################################

        - name: Load Internal CA for Argo CD
          ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/download_internal_ca.yaml"
    
        - name: Render {{ argocd_namespace }} helm values
          ansible.builtin.template:
            src: argocd.yaml.j2
            dest: "{{ k8s_manifests_dir }}/argocd.yaml"
            mode: '0644'
    
        - name: Read the TLS certificate file for argo
          ansible.builtin.slurp:
            src: "{{ k8s_manifests_dir }}/internal-ca.pem"
          register: public_key_ca_argo
    
        - name: Create argo ca cert
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: ca
                namespace: "{{ argocd_namespace }}"
              data: "{{ { k8s_ca_cert_filename: public_key_ca_argo.content } }}"
    
        # - name: Create ArgoCD ConfigMap with certificate
        #   kubernetes.core.k8s:
        #     kubeconfig: {{ k8s_manifests_dir }}/.kube/config      
        #     state: present
        #     definition: 
        #       apiVersion: v1
        #       kind: ConfigMap
        #       metadata:
        #         name: pki-ca-certs
        #         namespace: {{ argocd_namespace }}
        #       data:
        #         tls.crt: "{{ public_key_ca_argo.content | b64decode }}"  
    
        - name: Helming {{ argocd_namespace }}
          command: >-
            helm upgrade --install {{ item }}
            --create-namespace
            {{ argocd_chart_version | helm_chart_version_args }}
          loop:      
            - argocd argo/argo-cd --namespace {{ argocd_namespace }} -f {{ k8s_manifests_dir }}/argocd.yaml
