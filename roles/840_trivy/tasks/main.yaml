    - name: Remove {{ trivy_namespace }} Helm chart (absent)
      when: trivy_chart_state | default('present') == 'absent'
      ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/helm_chart_absent.yaml"
      vars:
        helm_chart_absent_releases:
          - name: trivy-operator
            namespace: "{{ trivy_namespace }}"
        helm_chart_absent_delete_namespace: true
        helm_chart_absent_namespaces:
          - "{{ trivy_namespace }}"
        helm_chart_absent_crd_patterns:
          - aquasecurity.github.io
        helm_chart_absent_local_files:
          - "{{ k8s_manifests_dir }}/trivy_values.yaml"

    - name: Install/configure trivy-operator chart
      when: trivy_chart_state | default('present') == 'present'
      block:
        - name: Render trivy-operator helm values
          ansible.builtin.template:
            src: trivy_values.yaml.j2
            dest: "{{ k8s_manifests_dir }}/trivy_values.yaml"
            mode: '0644'

        - name: Helming {{ trivy_namespace }}
          ansible.builtin.command: >-
            helm upgrade --install trivy-operator aquasecurity/trivy-operator
            --namespace {{ trivy_namespace }} --create-namespace
            -f {{ k8s_manifests_dir }}/trivy_values.yaml
            {{ trivy_chart_version | helm_chart_version_args }}

        - name: Wait for Trivy Operator Available
          ansible.builtin.command: >-
            kubectl wait --timeout=5m
            -n {{ trivy_namespace }}
            --for=condition=Available
            deploy/trivy-operator
          register: wait_trivy_operator
          until: wait_trivy_operator.rc == 0
          retries: 20
          delay: 6
          changed_when: false
