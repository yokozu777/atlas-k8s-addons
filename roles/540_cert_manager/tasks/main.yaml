    - name: Remove {{ cert_manager_namespace }} Helm chart (absent)
      when: cert_manager_chart_state | default('present') == 'absent'
      ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/helm_chart_absent.yaml"
      vars:
        helm_chart_absent_releases:
          - name: cert-manager
            namespace: "{{ cert_manager_namespace }}"
        helm_chart_absent_cluster_resources:
          - api_version: admissionregistration.k8s.io/v1
            kind: MutatingWebhookConfiguration
            name: cert-manager-webhook
          - api_version: admissionregistration.k8s.io/v1
            kind: ValidatingWebhookConfiguration
            name: cert-manager-webhook
        helm_chart_absent_local_files:
          - "{{ k8s_manifests_dir }}/cert-manager.yaml"
    - name: Install/configure cert_manager chart
      when: cert_manager_chart_state | default('present') == 'present'
      block:
        - name: Render {{ cert_manager_namespace }} cluster issuer manifest
          ansible.builtin.template:
            src: certmanager-cluster.yaml.j2
            dest: "{{ k8s_manifests_dir }}/certmanager-cluster.yaml"
            mode: '0644'
    
        - name: Load Internal CA for {{ cert_manager_namespace }}
          ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/download_internal_ca.yaml"

        - name: Render {{ cert_manager_namespace }} helm values
          ansible.builtin.template:
            src: cert-manager.yaml.j2
            dest: "{{ k8s_manifests_dir }}/cert-manager.yaml"
            mode: '0644'
    
        - name: Read the TLS certificate file for {{ cert_manager_namespace }}
          ansible.builtin.slurp:
            src: "{{ k8s_manifests_dir }}/internal-ca.pem"
          register: public_key_ca_certmanager
    
        - name: Create {{ cert_manager_namespace }} CA configmap
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: public-bundle
                namespace: "{{ cert_manager_namespace }}"
              data:
                ca-certificates.crt: "{{ public_key_ca_certmanager.content | b64decode }}"
    
        - name: Helming {{ cert_manager_namespace }}
          command: >-
            helm upgrade --install {{ item }}
            --create-namespace
            {{ cert_manager_chart_version | helm_chart_version_args }}
          loop:
            - cert-manager jetstack/cert-manager --namespace {{ cert_manager_namespace }} -f {{ k8s_manifests_dir }}/cert-manager.yaml
    
        - name: Apply {{ cert_manager_namespace }} k8s
          command: "kubectl --validate=false apply -f {{ k8s_manifests_dir }}/{{ item }}"
          loop:
            - "{{ k8s_certmanager_cluster_manifest }}"
