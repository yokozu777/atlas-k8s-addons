---
# Self-signed TLS for in-cluster RGW HTTPS. Secret is created once; helm values
# point CephObjectStore at it. Do not rotate on every run (would restart RGW).
- name: Ensure Rook cluster namespace for RGW TLS secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ rook_cluster_namespace }}"

- name: Stat RGW TLS secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ rook_rgw_https_secret }}"
    namespace: "{{ rook_cluster_namespace }}"
  register: rook_rgw_https_secret_info

- name: Generate RGW TLS secret when missing
  when: rook_rgw_https_secret_info.resources | default([]) | length == 0
  ansible.builtin.shell: |
    set -euo pipefail
    tmp=$(mktemp -d)
    trap 'rm -rf "$tmp"' EXIT
    openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
      -keyout "$tmp/tls.key" -out "$tmp/tls.crt" \
      -subj "/CN={{ rook_rgw_tls_cn }}" \
      -addext "subjectAltName={{ rook_rgw_tls_san }}"
    kubectl create secret tls {{ rook_rgw_https_secret }} \
      --namespace {{ rook_cluster_namespace }} \
      --cert="$tmp/tls.crt" \
      --key="$tmp/tls.key" \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ k8s_kubeconfig | default(controller_kubeconfig) }}"
  changed_when: true
