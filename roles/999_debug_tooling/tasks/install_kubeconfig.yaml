---
- name: Ensure kubeconfig directory exists for debug tooling
  ansible.builtin.file:
    path: "{{ k8s_admin_home }}/.kube"
    state: directory
    owner: "{{ k8s_admin_user }}"
    group: "{{ k8s_admin_user }}"
    mode: '0700'

- name: Install kubeconfig for node-side debugging
  ansible.builtin.copy:
    content: "{{ debug_tooling_kubeconfig_content | b64decode }}"
    dest: "{{ k8s_node_kubeconfig }}"
    owner: "{{ k8s_admin_user }}"
    group: "{{ k8s_admin_user }}"
    mode: '0600'
