---
- name: Stat controller kubeconfig for debug tooling distribution
  ansible.builtin.stat:
    path: "{{ controller_kubeconfig }}"
  delegate_to: "{{ k8s_cluster_fact_host }}"
  connection: local
  become: false
  run_once: true
  register: debug_tooling_controller_kubeconfig_stat

- name: Fail when controller kubeconfig is missing for debug tooling install
  ansible.builtin.assert:
    that:
      - debug_tooling_controller_kubeconfig_stat.stat.exists | default(false) | bool
      - debug_tooling_controller_kubeconfig_stat.stat.size | default(0) | int > 0
    fail_msg: >-
      Controller kubeconfig {{ controller_kubeconfig }} is missing or empty.
      Run 29_fetch_kubeconfig before distributing kubeconfig via 999_debug_tooling.
  run_once: true

- name: Read controller kubeconfig for debug tooling distribution
  ansible.builtin.slurp:
    src: "{{ controller_kubeconfig }}"
  delegate_to: "{{ k8s_cluster_fact_host }}"
  connection: local
  become: false
  run_once: true
  register: debug_tooling_controller_kubeconfig_slurp

- name: Share controller kubeconfig payload with install targets
  ansible.builtin.set_fact:
    debug_tooling_kubeconfig_content: >-
      {{ hostvars[ansible_play_hosts[0]].debug_tooling_controller_kubeconfig_slurp.content }}
  when: inventory_hostname in debug_tooling_kubeconfig_target_hosts
