    - name: Wait for rook-ceph-tools pod to be ready
      ansible.builtin.shell: >
        kubectl
        wait --for=condition=Ready pod
        -l app=rook-ceph-tools -n {{ rook_cluster_namespace }} --timeout=180s
      register: wait_ceph_tools
      until: wait_ceph_tools.rc == 0
      retries: 100
      delay: 3

    - name: Wait for rook-ceph-mgr pod to be ready
      ansible.builtin.shell: >
        kubectl
        wait --for=condition=Ready pod
        -l app=rook-ceph-mgr -n {{ rook_cluster_namespace }} --timeout=180s
      register: wait_ceph_mgr
      until: wait_ceph_mgr.rc == 0
      retries: 100
      delay: 3

    - name: Set password for admin user in Ceph dashboard via rook-ceph-tools
      ansible.builtin.shell: |
        set -o pipefail
        printf '%s' "${CEPH_DASHBOARD_PASSWORD}" | kubectl exec -n {{ rook_cluster_namespace }} \
          -i deployment/rook-ceph-tools -- \
          ceph dashboard ac-user-set-password --force-password {{ k8s_users.ceph_dashboard }} -i /dev/stdin
      environment:
        CEPH_DASHBOARD_PASSWORD: "{{ k8s_secrets.ceph_dashboard_password }}"
      no_log: true
      changed_when: true
