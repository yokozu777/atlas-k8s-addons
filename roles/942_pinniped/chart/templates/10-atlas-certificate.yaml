apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.httpsSecretName }}
  namespace: {{ .Values.pinnipedNamespace }}
spec:
  secretName: {{ .Values.httpsSecretName }}
  issuerRef:
    name: {{ .Values.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.pinnipedHost | quote }}
