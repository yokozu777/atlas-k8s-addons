apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.loginUi.serviceName }}
  namespace: {{ .Values.pinnipedNamespace }}
  labels:
    app: {{ .Values.loginUi.serviceName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.loginUi.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.loginUi.serviceName }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/20-login-configmap.yaml") . | sha256sum }}
    spec:
      # alpine nginx: pid /run/nginx.pid, error_log /var/log/nginx; do not mount /var/run.
      containers:
        - name: nginx
          image: {{ .Values.loginUi.image | quote }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: kubeconfig
              mountPath: /data
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-log
              mountPath: /var/log/nginx
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: {{ .Values.loginUi.serviceName }}
            items:
              - key: index.html
                path: index.html
        - name: nginx-conf
          configMap:
            name: {{ .Values.loginUi.serviceName }}
            items:
              - key: default.conf
                path: default.conf
        - name: kubeconfig
          secret:
            secretName: {{ .Values.loginUi.kubeconfigSecret }}
            items:
              - key: kubeconfig
                path: kubeconfig
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-log
          emptyDir: {}
