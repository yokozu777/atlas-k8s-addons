# Prefer editing group_vars/all/atlas-k8s-addons.secrets.yml (Vault-friendly canonical overlay).
# Standalone EXTRA_VARS_FILE alternative:
#   cp examples/secrets.example.yml /path/to/secrets.yml   # keep outside git if plaintext
#   # fill values, optionally: ansible-vault encrypt /path/to/secrets.yml
#   EXTRA_VARS_FILE=/path/to/secrets.yml ./run.sh
#

# Example secrets overlay for ./run.sh
# Usage:
#   cp examples/secrets.example.yml /path/to/k8s-addons-secrets.yml   # keep outside git
#   # fill values, optionally: ansible-vault encrypt /path/to/k8s-addons-secrets.yml
#   EXTRA_VARS_FILE=/path/to/k8s-addons-secrets.yml ./run.sh
#
# These keys override group_vars/all/atlas-k8s-addons.yml. Do not commit real secrets.
# group_vars/all/atlas-k8s-addons.yml already ships inert CHANGEME placeholders so validate works
# without this file; use this overlay for production values.

# --- passwords / tokens (also wired into k8s_secrets via all.yml aggregates) ---
grafana_admin_password: "CHANGEME"
keycloak_admin_password: "CHANGEME"
keycloak_oidc_user_password: "CHANGEME_oidc_user"
oauth2_proxy_client_secret: "CHANGEME_oauth2_proxy_client_secret_32b"
oauth2_proxy_cookie_secret: "CHANGEME_oauth2_proxy_cookie_secret_32b"
envoy_gateway_oidc_client_secret: "CHANGEME_envoy_gateway_oidc_client_secret_32b"
vault_oidc_client_secret: "CHANGEME_vault_oidc_client_secret_32b"
openbao_oidc_client_secret: "CHANGEME_openbao_oidc_client_secret_32b"
argocd_oidc_client_secret: "CHANGEME_argocd_oidc_client_secret_32b"
pinniped_supervisor_client_secret: "CHANGEME_pinniped_supervisor_client_secret_32b"
mailu_secret_key: "CHANGEME_mailu_secret_key_32bytesxx"
mailu_initial_password: "CHANGEME_mailu_initial"
external_dns_tsig_secret: "CHANGEME_external_dns_tsig_secret_base64"
external_dns_apex_tsig_secret: "CHANGEME_external_dns_apex_tsig_secret_base64"
external_dns_istio_tsig_secret: "CHANGEME_external_dns_istio_tsig_secret_base64"
ceph_dashboard_password: "CHANGEME"
elastic_password: "CHANGEME_elastic"
elastic_cert_password: "CHANGEME_elastic_cert"
elastic_logger_password: "CHANGEME_elastic_logger"
elastic_admin_password: "CHANGEME_elastic_admin"
elastic_jaeger_password: "CHANGEME_elastic_jaeger"
# elasticsearch_snapshot_s3_access_key / elasticsearch_snapshot_s3_secret_key — external-s3 only (omit for rook-rgw)
# thanos objstore credentials come from Rook OBC (not this file)
kibana_elastic_password: "CHANGEME_kibana_elastic"
# Must be at least 32 characters (130_validate_vars)
kibana_encryption_key: "CHANGEME_kibana_encryption_key_min_32_chars"
# htpasswd/bcrypt hash for Argo CD admin (htpasswd -nbBC 10 "" 'password' | tr -d ':\n' | sed 's/$2y/$2a/')
argocd_admin_password_bcrypt: "$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy"
sentry_smtp_password: "CHANGEME_sentry_smtp"
sentry_admin_password: "CHANGEME_sentry_admin"
alertmanager_smtp_password: "CHANGEME_alertmanager_smtp"
graylog_root_password: "CHANGEME_graylog_root_password"
vault_admin_password: "CHANGEME_vault_admin"
openbao_admin_password: "CHANGEME_openbao_admin"

# --- non-secret but often site-local (also validated) ---
grafana_dashboards_timezone: UTC
sentry_admin_email: admin@example.com
sentry_mail:
  backend: smtp
  use_tls: true
  host: smtp.example.com
  port: 587
  username: sentry@example.com
  from: sentry@example.com
alertmanager_mail:
  use_tls: true
  host: smtp.example.com
  port: 587
  username: alertmanager@example.com
  from: alertmanager@example.com
  to: ops@example.com
  insecure_skip_verify: false

