# atlas-k8s-addons — variable catalog for standalone runs
# =======================================================
# Operator surface that must satisfy roles/130_validate_vars.
# Deep chart knobs live under roles/*/defaults/main.yml.
# Workspace dirs are created by role 110_workspace (tag 110_workspace).
#
# Secrets: see group_vars/all/atlas-k8s-addons.secrets.yml (Vault-friendly).
# Aggregate k8s_secrets: stays in this catalog (Jinja refs → secrets overlay).
# Standalone alternative: EXTRA_VARS_FILE=examples/secrets.example.yml
#
# Sibling control-plane bootstrap: atlas-k8s-core (same inventory group names).

# --------------------------------------------
# REQUIRED — identity / workspace / targeting
# --------------------------------------------

# Inventory group targeting (override to rename groups)
k8s_master_hosts: k8s_masters
k8s_worker_hosts: k8s_workers

# --- 999_debug_tooling (optional break-glass CLI on cluster nodes) ---
debug_tooling_install_dir: /usr/local/bin
debug_tooling_staging_dir: /var/tmp/ansible-debug-tooling
debug_tooling_helm_enabled: false
debug_tooling_helm_hosts: "{{ k8s_master_hosts }}"
debug_tooling_calicoctl_enabled: true
debug_tooling_calicoctl_hosts: "{{ k8s_master_hosts }}"
debug_tooling_istioctl_enabled: true
debug_tooling_istioctl_hosts: "{{ k8s_master_hosts }}"
debug_tooling_etcdctl_enabled: true
debug_tooling_etcdctl_hosts: "{{ k8s_master_hosts }}"
# github = public GitHub Releases; infra = helm-nginx releases.helm.* vhost
debug_tooling_binary_source: github
debug_tooling_binary_infra_base: ""
# Empty = skip kubeconfig install. Example: k8s_masters
debug_tooling_install_kubeconfig: ""


# Identity / DNS
dns_domain_suffix: example.com
cluster_domain: k8s.example.com
k8s_cluster_domain: "{{ cluster_domain }}"
k8s_cluster_name: atlas
k8s_dns_domain: cluster.local
k8s_lb_hostname: kubelb
k8s_api_port: 6443
control_plane_endpoint: "{{ k8s_lb_hostname }}.{{ dns_domain_suffix }}:{{ k8s_api_port }}"

# SSH / node admin (140_fetch_kubeconfig, 999_debug_tooling)
ansible_user: localuser
k8s_admin_user: "{{ ansible_user }}"
k8s_admin_home: "/home/{{ k8s_admin_user }}"

# Controller workspace (role 110_workspace)
# cluster_workspace_id must equal k8s_cluster_domain (validate contract).
# Prefer CLUSTER_WORKSPACE_* from ./run.sh (absolute paths).
# 110_workspace re-resolves env and realigns controller_* under the active root.
cluster_workspace_id: "{{ lookup('ansible.builtin.env', 'CLUSTER_WORKSPACE_ID') | default(k8s_cluster_domain, true) }}"
cluster_workspace_parent: "{{ lookup('ansible.builtin.env', 'CLUSTER_WORKSPACE_PARENT') | default('./workspace', true) }}"
cluster_workspace_root: "{{ lookup('ansible.builtin.env', 'CLUSTER_WORKSPACE_ROOT') | default(cluster_workspace_parent ~ '/' ~ cluster_workspace_id, true) }}"

controller_workspace: "{{ cluster_workspace_root }}/controller-state"
controller_manifests_dir: "{{ controller_workspace }}/manifests"
controller_reports_dir: "{{ controller_workspace }}/reports"
controller_kubeconfig: "{{ controller_workspace }}/kubeconfig/admin.conf"
controller_python_venv: "{{ controller_workspace }}/venv"
controller_bin_dir: "{{ controller_workspace }}/bin"
controller_helm_config_dir: "{{ controller_workspace }}/helm-config"
controller_helm_cache_dir: "{{ controller_helm_config_dir }}/cache"
controller_ca_cert_dir: "{{ controller_workspace }}/certs"
k8s_ca_cert_filename: ca.crt
controller_ca_cert_path: "{{ controller_ca_cert_dir }}/{{ k8s_ca_cert_filename }}"
controller_ssl_cert_file: "{{ controller_ca_cert_dir }}/ca-bundle.crt"
controller_tls_environment: "{{
  {
    'SSL_CERT_FILE': controller_ssl_cert_file,
    'REQUESTS_CA_BUNDLE': controller_ssl_cert_file,
    'GIT_SSL_CAINFO': controller_ssl_cert_file
  } if (pki_ca_url | default('') | length > 0) else {}
}}"
controller_staging_dir: "{{ controller_workspace }}/staging"
controller_secrets_dir: "{{ controller_workspace }}/secrets"
k8s_control_plane_scripts_dir: "{{ controller_workspace }}/scripts"
keycloak_tf_workspace: "{{ controller_staging_dir }}/keycloak-realm"
# Filesystem mirror for terraform-provider-keycloak (lab overlay: /usr/local/share/terraform/plugins).
keycloak_tf_plugin_dir: "{{ lookup('env', 'HOME') }}/.terraform.d/plugins"
keycloak_tf_plugin_cache_dir: "{{ lookup('env', 'HOME') }}/.terraform.d/plugin-cache"
keycloak_tf_provider_version: "5.8.0"
k8s_kibana_chart_dir: "{{ controller_staging_dir }}/kibana"

# Workspace layout stubs (path-prefix contract; created by 110_workspace)
# Durable TF state: <atlas_cluster_root>/tfstate/<cluster_id>/ (sibling of workspace/)
provision_tf_state_local_dir: "{{ atlas_cluster_root | default('.', true) }}/tfstate"
provision_tf_state_cluster_path: "{{ cluster_id | default(cluster_workspace_id, true) }}"
provision_tf_state_repo_dir: "{{ provision_tf_state_local_dir }}/{{ provision_tf_state_cluster_path }}"
provision_tf_workspace_dir: "{{ cluster_workspace_root }}/tf_workspace"
provision_generated_variables_tf: "{{ cluster_workspace_root }}/generated/variables.tf"
build_workdir: "{{ cluster_workspace_root }}/build/workspace"
build_state_file: "{{ cluster_workspace_root }}/build/build_templates_state.json"

# Rook storage nodes SoT (430_rook_cluster). Standalone: copy examples/provision_hosts.example.yml
# (or point at your provision inventory). Children group name must match k8s_worker_hosts.
provision_hosts_file: "{{ playbook_dir }}/../examples/provision_hosts.example.yml"
provision_rook_database_size_mb: "1024"
provision_rook_data_disk_index: 1
provision_rook_wwn_path_prefix: "/dev/disk/by-id/wwn-"

# Platform aliases (roles 210–999 on controller)
k8s_kubeconfig: "{{ controller_kubeconfig }}"
k8s_manifests_dir: "{{ controller_manifests_dir }}"
k8s_python_venv: "{{ controller_python_venv }}"
k8s_cluster_fact_host: localhost
k8s_kubeadm_admin_kubeconfig: /etc/kubernetes/admin.conf

# First control-plane host (140_fetch_kubeconfig SSH from controller)
k8s_control_plane_master_host: "{{ groups.get(k8s_master_hosts, []) | first | default('', true) }}"
k8s_control_plane_ssh_user: "{{ k8s_admin_user }}"
k8s_control_plane_ssh_target: "{{ k8s_control_plane_ssh_user }}@{{ k8s_control_plane_master_host }}"
k8s_control_plane_ssh_private_key_file: >-
  {{
    lookup('ansible.builtin.env', 'ANSIBLE_PRIVATE_KEY_FILE', default='')
    | default(lookup('ansible.builtin.env', 'SSH_KEY', default=''), true)
    | default(ansible_ssh_private_key_file | default(''), true)
  }}
k8s_control_plane_ssh_extra_args: []

# PKI placeholder (required by validate; used when use_internal_helm_repo is nexus|nginx)
pki_ca_url:
  - "https://ca.example.com:8443/roots.pem"

# Cluster network (must match atlas-k8s-core / live cluster)
vip_address: 192.168.1.210
pod_subnet: 172.16.0.0/16
# kubeadm kube-dns: 10th address of service_subnet
cluster_dns_ip: 10.0.0.10

# DNS that external-dns updates (BIND or other RFC2136 target)
dns_server_ip: 192.168.1.53

# --------------------------------------------
# REQUIRED — Helm / platform catalog
# --------------------------------------------

# --- 210_helm_bootstrap (atlas-k8s-addons) ---
helm_version: https://get.helm.sh/helm-v4.2.1-linux-amd64.tar.gz

# Standalone default: public Helm repos (no internal TLS mirror).
# For air-gapped: use_internal_helm_repo: nginx|nexus and fill nexus_*/helm_repo_nginx_* (see role 210).
use_internal_helm_repo: none
setup_helm_repo_nginx: false
setup_helm_nginx: "{{ use_internal_helm_repo == 'nginx' and setup_helm_repo_nginx }}"
# Placeholder required by 130_validate_vars even when mode is none (override for real Nexus).
nexus_host: nexus.example.com
nexus_base_url: "https://{{ nexus_host }}/repository"
helm_repo_nginx_ingress_domain: ""
# Public upstream SoT + nexus_path; helm_repos.path must match nexus_path
# nginx hostname: <helm_repos.name>.helm.<dns_domain_suffix> (filter helm_repo_client_url)
# chart_hosts (optional): extra chart URL hosts in index.yaml for sub_filter
helm_repo_upstreams:
  - { name: oauth2-proxy, nexus_path: oauth2-proxy, upstream_url: "https://oauth2-proxy.github.io/manifests", upstream_host: oauth2-proxy.github.io }
  - { name: falcosecurity, nexus_path: falco, upstream_url: "https://falcosecurity.github.io/charts", upstream_host: falcosecurity.github.io }
  - { name: projectcalico, nexus_path: calico, upstream_url: "https://docs.tigera.io/calico/charts", upstream_host: docs.tigera.io, chart_hosts: [github.com] }
  - { name: metallb, nexus_path: metallb, upstream_url: "https://metallb.github.io/metallb", upstream_host: metallb.github.io }
  - { name: prometheus-community, nexus_path: prometheus-community, upstream_url: "https://prometheus-community.github.io/helm-charts", upstream_host: prometheus-community.github.io }
  - { name: ceph-csi-operator, nexus_path: rook-ceph-csi-operator, upstream_url: "https://ceph.github.io/ceph-csi-operator", upstream_host: ceph.github.io }
  - { name: rook-release, nexus_path: rook-release, upstream_url: "https://charts.rook.io/release", upstream_host: charts.rook.io }
  - { name: fluent, nexus_path: fluent, upstream_url: "https://fluent.github.io/helm-charts", upstream_host: fluent.github.io }
  - { name: elastic, nexus_path: helm.elastic.local/, upstream_url: "https://helm.elastic.co", upstream_host: helm.elastic.co }
  - { name: hashicorp, nexus_path: helm.releases.hashicorp.com/, upstream_url: "https://helm.releases.hashicorp.com", upstream_host: helm.releases.hashicorp.com }
  - { name: openbao, nexus_path: openbao-helm/, upstream_url: "https://openbao.github.io/openbao-helm", upstream_host: openbao.github.io }
  - { name: istio, nexus_path: istio/, upstream_url: "https://istio-release.storage.googleapis.com/charts", upstream_host: istio-release.storage.googleapis.com }
  - { name: kiali, nexus_path: kiali/, upstream_url: "https://kiali.org/helm-charts", upstream_host: kiali.org }
  - { name: argo, nexus_path: argo/, upstream_url: "https://argoproj.github.io/argo-helm", upstream_host: argoproj.github.io }
  - { name: codecentric, nexus_path: codecentric/, upstream_url: "https://codecentric.github.io/helm-charts", upstream_host: codecentric.github.io }
  - { name: sentry, nexus_path: sentry/, upstream_url: "https://sentry-kubernetes.github.io/charts", upstream_host: sentry-kubernetes.github.io }
  - { name: jetstack, nexus_path: jetstack/, upstream_url: "https://charts.jetstack.io", upstream_host: charts.jetstack.io }
  - { name: kong-z, nexus_path: kong-z/, upstream_url: "https://charts.konghq.com", upstream_host: charts.konghq.com, chart_hosts: [github.com] }
  - { name: metrics-server, nexus_path: metrics-server/, upstream_url: "https://kubernetes-sigs.github.io/metrics-server", upstream_host: kubernetes-sigs.github.io }
  - { name: aquasecurity, nexus_path: aquasecurity/, upstream_url: "https://aquasecurity.github.io/helm-charts", upstream_host: aquasecurity.github.io }
  - { name: kubecost, nexus_path: kubecost/, upstream_url: "https://kubecost.github.io/cost-analyzer", upstream_host: kubecost.github.io }
  - { name: opencost, nexus_path: opencost/, upstream_url: "https://opencost.github.io/opencost-helm-chart", upstream_host: opencost.github.io }
  - { name: kafka-ui, nexus_path: kafka-ui/, upstream_url: "https://provectus.github.io/kafka-ui-charts", upstream_host: provectus.github.io }
  - { name: chaos-mesh, nexus_path: chaos-mesh/, upstream_url: "https://charts.chaos-mesh.org", upstream_host: charts.chaos-mesh.org }
  - { name: kubevious, nexus_path: kubevious/, upstream_url: "https://helm.kubevious.io", upstream_host: helm.kubevious.io }
  - { name: external-secrets, nexus_path: external-secrets/, upstream_url: "https://external-secrets.io", upstream_host: external-secrets.io, chart_hosts: [github.com] }
  - { name: external-dns, nexus_path: external-dns/, upstream_url: "https://kubernetes-sigs.github.io/external-dns", upstream_host: kubernetes-sigs.github.io }
  - { name: jaegertracing, nexus_path: jaegertracing/, upstream_url: "https://jaegertracing.github.io/helm-charts", upstream_host: jaegertracing.github.io }
  - { name: open-telemetry, nexus_path: open-telemetry/, upstream_url: "https://open-telemetry.github.io/opentelemetry-helm-charts", upstream_host: open-telemetry.github.io }
  - { name: cnpg, nexus_path: cnpg/, upstream_url: "https://cloudnative-pg.io/charts", upstream_host: cloudnative-pg.io, chart_hosts: [github.com] }
  - { name: headlamp, nexus_path: headlamp/, upstream_url: "https://kubernetes-sigs.github.io/headlamp/", upstream_host: kubernetes-sigs.github.io }
  - { name: thanos-community, nexus_path: thanos-community, upstream_url: "https://thanos-community.github.io/helm-charts", upstream_host: thanos-community.github.io }
  - { name: kyverno, nexus_path: kyverno/, upstream_url: "https://kyverno.github.io/kyverno/", upstream_host: kyverno.github.io }
  - { name: policy-reporter, nexus_path: policy-reporter/, upstream_url: "https://kyverno.github.io/policy-reporter", upstream_host: kyverno.github.io }
  - { name: mailu, nexus_path: mailu/, upstream_url: "https://mailu.github.io/helm-charts", upstream_host: mailu.github.io }

helm_repos:
  - { name: oauth2-proxy, path: oauth2-proxy }
  - { name: falcosecurity, path: falco }
  - { name: projectcalico, path: calico }
  - { name: metallb, path: metallb }
  - { name: prometheus-community, path: prometheus-community }
  - { name: ceph-csi-operator, path: rook-ceph-csi-operator }
  - { name: rook-release, path: rook-release }
  - { name: fluent, path: fluent }
  - { name: elastic, path: helm.elastic.local/ }
  - { name: hashicorp, path: helm.releases.hashicorp.com/ }
  - { name: openbao, path: openbao-helm/ }
  - { name: istio, path: istio/ }
  - { name: kiali, path: kiali/ }
  - { name: argo, path: argo/ }
  - { name: codecentric, path: codecentric/ }
  - { name: sentry, path: sentry/ }
  - { name: jetstack, path: jetstack/ }
  - { name: kong-z, path: kong-z/ }
  - { name: metrics-server, path: metrics-server/ }
  - { name: aquasecurity, path: aquasecurity/ }
  - { name: kubecost, path: kubecost/ }
  - { name: opencost, path: opencost/ }
  - { name: kafka-ui, path: kafka-ui/ }
  - { name: chaos-mesh, path: chaos-mesh/ }
  - { name: kubevious, path: kubevious/ }
  - { name: external-secrets, path: external-secrets/ }
  - { name: external-dns, path: external-dns/ }
  - { name: jaegertracing, path: jaegertracing/ }
  - { name: open-telemetry, path: open-telemetry/ }
  - { name: cnpg, path: cnpg/ }
  - { name: headlamp, path: headlamp/ }
  - { name: thanos-community, path: thanos-community }
  - { name: kyverno, path: kyverno/ }
  - { name: policy-reporter, path: policy-reporter/ }
  - { name: mailu, path: mailu/ }
# Remaining namespaces: 210_helm_bootstrap; list below = needed before helm (secrets/prepare)
# Helm --create-namespace: tracing, falco, istio-system, vault, openbao, chaos-mesh, argo-rollouts, oauth2-proxy, cnpg-system, headlamp, kyverno, policy-reporter, pinniped, mailu, trivy-system, opencost
k8s_platform_namespaces:
  - "{{ monitoring_namespace }}"
  - "{{ logging_namespace }}"
  - "{{ keycloak_namespace }}"
  - "{{ argocd_namespace }}"
  - "{{ cert_manager_namespace }}"

# --- Upstream workarounds (remove when fixed upstream) ---
# Calico OSS: audit-logging VWC without handler → kube-apiserver noise; suppress in Fluent Bit.
fluentbit_suppress_calico_audit_webhook_noise: true
# kube-apiserver /metrics: etcd health on every scrape → cancelled dial noise.
prometheus_kube_apiserver_scrape_interval: 60s
# ceph-csi-drivers <=1.0.1: missing volumeattributesclasses RBAC (csi-resizer, K8s 1.29+).
rook_csi_volumeattributesclass_rbac: true

# --- 220_calico (atlas-k8s-addons) ---
calico_operator_namespace: tigera-operator
calico_system_namespace: calico-system
# Dataplane: eBPF (linuxDataplane=BPF in calico.yaml; BGP off, encapsulation VXLANCrossSubnet).
calico_linux_dataplane: BPF
calico_bgp: Disabled
calico_ip_pool_encapsulation: VXLANCrossSubnet
# CRDs: helm template calico-crds projectcalico/projectcalico.org.v3 --version <calico_chart_version>
# On calico_chart_version change: re-apply CRDs + helm upgrade -f calico.yaml (no --reuse-values).
calico_chart_version: "v3.32.0"
calico_chart_state: present

# --- 310_prometheus ---
monitoring_namespace: monitoring
prometheus_chart_version: ""
prometheus_chart_state: present
# grafana_admin_password → atlas-k8s-addons.secrets.yml
grafana: admin
grafana_dashboards_timezone: UTC
# grafana_host / alertmanager_host — see 560_apply_ingress
# alertmanager_smtp_password → atlas-k8s-addons.secrets.yml
alertmanager_mail:
  use_tls: true
  host: smtp.example.com
  port: 587
  username: alertmanager@example.com
  from: alertmanager@example.com
  to: ops@example.com
  insecure_skip_verify: false
# Per-entity dashboard origin for 310_prometheus (grafana.dashboards + Calico Typha get_url).
# github = https://raw.githubusercontent.com/<path>
# grafana = grafana.com gnetId (grafana-native)
# infra = grafana_dashboard_infra_base + github path or /api/dashboards/{id}/revisions/{rev}/download
# github-native: github|infra; grafana-native: grafana|infra (130_validate_vars).
grafana_dashboard_infra_base: ""
grafana_dashboard_source:
  # github-native (JSON in git; path after the origin is unchanged)
  istio: github
  ceph: github
  envoy: github
  thanos: github
  falco: github
  cnpg: github
  keycloak: github
  argocd: github
  argo_rollouts: github
  external_secrets: github
  jaeger: github
  calico_typha: github
  # grafana-native (no JSON in git; Helm gnetId or infra url)
  calico: grafana
  metallb: grafana
  vault: grafana
  fluentbit: grafana
  cert_manager: grafana
  elasticsearch: grafana
  blackbox: grafana
  consul: grafana
  external_dns: grafana
  chaos_mesh: grafana
  opentelemetry: grafana
  trivy: grafana
  opencost: grafana

# --- 320_blackbox ---
blackbox_exporter_chart_version: ""
blackbox_exporter_chart_state: present
# (ingress: see k8s_ingress_apps.blackbox)

# --- 330_prometheus_adapter ---
# Resource metrics.k8s.io for HPA. containerQuery and nodeQuery skip cAdvisor
# pause/pod cgroup (container!="", container!="POD"). nodeQuery uses label node
# (not instance, not id=/ — cgroup v2 has no root series).
prometheus_adapter_chart_version: ""
prometheus_adapter_chart_state: present

# --- 340_calico_metrics ---
# (role has no dedicated vars)

# --- 410_snapshotter ---
# github        — public upstream kubernetes-csi/external-snapshotter (git clone on master)
# private-git   — user fork: set snapshotter_repo
# internal-nginx — kustomize over HTTPS from custom nginx, no git on cluster
get_snapshotter: github
setup_custom_nginx: false
snapshotter_version: 8.6.0
snapshotter_github_repo: https://github.com/kubernetes-csi/external-snapshotter.git
# private-git only: e.g. https://git.example.com/user/external-snapshotter.git
snapshotter_repo: ""
external_snapshotter_dir: "{{ k8s_manifests_dir }}/external-snapshotter"
# Derived: do not override manually (130_validate_vars will fail)
setup_custom_content_nginx: "{{ get_snapshotter == 'internal-nginx' and setup_custom_nginx }}"
snapshotter_effective_repo: >-
  {{ snapshotter_github_repo if get_snapshotter == 'github' else snapshotter_repo }}
snapshotter_kustomize_base_url: >-
  https://{{ custom_nginx_ingress_domain }}/external-snapshotter/v{{ snapshotter_version }}
custom_nginx_content:
  - name: external-snapshotter
    source_repo: "{{ snapshotter_github_repo }}"
    version: "{{ snapshotter_version }}"
    sync_paths:
      - client
      - deploy/kubernetes
    dest_subdir: "external-snapshotter/v{{ snapshotter_version }}"
snapshotter_archive_filename: "external-snapshotter-v{{ snapshotter_version }}.tar.gz"
snapshotter_archive_url: "https://{{ custom_nginx_ingress_domain }}/{{ snapshotter_archive_filename }}"

# --- 420_rook_operator, 430_rook_cluster, 440_rook_csi_drivers ---
rook_operator_namespace: rook-ceph
rook_cluster_namespace: rook-ceph-cluster
rook_operator_chart_version: ""
rook_operator_chart_state: present
rook_cluster_chart_version: ""
rook_cluster_chart_state: present
rook_csi_drivers_chart_version: ""
rook_csi_drivers_chart_state: present
# Ceph mon TOO_MANY_PGS threshold (string in CephCluster.spec.cephConfig.global).
# Default 250 trips on 3-OSD labs with RBD+CephFS+RGW (~265 PG/OSD). Raises the
# warn bar only; does not resize pools. Empty = omit (Ceph default 250).
rook_mon_max_pg_per_osd: "500"
# RGW HTTPS (self-signed) so Thanos/minio-go does not STREAMING-AWS4 PutObject over HTTP.
rook_objectstore_name: ceph-objectstore
rook_rgw_https_secret: rook-ceph-rgw-tls
rook_rgw_secure_port: 443

# --- 450_thanos ---
# Community chart (GitHub Pages, not Bitnami/OCI). Prometheus remote_write -> Receive; no sidecar.
# Grafana default stays Prometheus; Query is an additional datasource. Adapter/HPA stay on Prometheus.
# Objstore uses RGW :443 (not OBC BUCKET_PORT 80). OBC BUCKET_REGION is often empty — default us-east-1.
thanos_chart_version: "0.32.0"
thanos_chart_state: present
thanos_objstore_secret: thanos-objstore
thanos_obc_name: thanos-blocks
thanos_storage_class: ceph-bucket
thanos_s3_region: us-east-1
thanos_s3_endpoint_port: 443
thanos_s3_insecure: false
thanos_s3_tls_insecure_skip_verify: true
thanos_pvc_storage_class: ceph-block
thanos_receive_replicas: 1
thanos_query_replicas: 1
thanos_store_replicas: 1
thanos_receive_pvc_size: 10Gi
thanos_store_pvc_size: 8Gi
thanos_compactor_pvc_size: 10Gi
thanos_compactor_retention_raw: 30d
thanos_compactor_retention_5m: 60d
thanos_compactor_retention_1h: 90d
thanos_receive_tsdb_retention: 24h
thanos_prometheus_retention: 24h
thanos_query_http_url: "http://thanos-query.{{ monitoring_namespace }}.svc.{{ k8s_dns_domain }}:9090"
thanos_receive_remote_write_url: "http://thanos-receive.{{ monitoring_namespace }}.svc.{{ k8s_dns_domain }}:10908/api/v1/receive"

# --- 510_metallb ---
metallb_namespace: metallb-system
metallb_chart_version: "0.16.1"
metallb_chart_state: present
metallb_ip_pool: "192.168.1.150-192.168.1.199"

# --- 520_envoy_gateway ---
envoy_gateway_namespace: envoy-gateway-system
