    namespace: "{{ opencost_namespace }}"
    service: opencost
    port: 9090
    oidc_auth: true

# --- 610_elasticsearch_prepare, 620_elasticsearch ---
elasticsearch_chart_version: ""
elasticsearch_chart_state: present
logging_namespace: logging
elastic_es_output_host: elasticsearch-master
elastic_es_output_port: 9200
ESimageTag: "9.4.2"
# elastic_password → atlas-k8s-addons.secrets.yml
# elastic_cert_password → atlas-k8s-addons.secrets.yml
# elastic_logger_password → atlas-k8s-addons.secrets.yml
# elastic_admin_password → atlas-k8s-addons.secrets.yml
# elastic_jaeger_password → atlas-k8s-addons.secrets.yml
elastic_superuser: elastic
elastic_logger: logger
elastic_admin: admin
elastic_jaeger: jaeger
# Daily kube-logs-*/host-logs-* ILM delete (no rollover). replicas 0 for 1-node ES.
elasticsearch_ilm_delete_after: 7d
elasticsearch_logs_index_replicas: 0
# SLM to Rook RGW via ObjectBucketClaim (access keys from the Rook Secret, not this overlay).
# rook-rgw | external-s3 | none. Snapshots share Ceph with the ES PVC (not offsite DR).
elasticsearch_snapshot_backend: rook-rgw
elasticsearch_snapshot_storage_class: ceph-bucket
elasticsearch_snapshot_obc_name: elasticsearch-snapshots
elasticsearch_snapshot_repo_name: atlas-logs
elasticsearch_slm_schedule: "0 30 1 * * ?"
elasticsearch_slm_expire_after: 30d
# external-s3 only; omit for rook-rgw.
# elasticsearch_snapshot_s3_access_key / elasticsearch_snapshot_s3_secret_key → atlas-k8s-addons.secrets.yml
elasticsearch_snapshot_s3_endpoint: ""
elasticsearch_snapshot_s3_bucket: ""
elasticsearch_snapshot_s3_protocol: https

# --- 630_kibana_prepare, 640_kibana ---
kibana_chart_version: "8.5.1"
kibana_chart_state: present
KibanaimageTag: "9.4.2"
kibana_chart_artifact: "kibana-{{ kibana_chart_version }}.tgz"
# kibana_encryption_key → atlas-k8s-addons.secrets.yml
# kibana_elastic_password → atlas-k8s-addons.secrets.yml

# --- 650_fluentbit ---
fluentbit_chart_version: ""
fluentbit_chart_state: present
# Cheap gate before kubernetes/Lua (error/warn/crit or allowlist ns). false + empty
# exclude list = old full ingest. Lua still stamps atlas_severity on survivors.
fluentbit_early_severity_gate: true
# CRI files never opened (even errors). Ceph/chaos health is Grafana.
fluentbit_kube_tail_exclude_namespaces:
  - rook-ceph
  - rook-ceph-cluster
  - chaos-mesh
# Full log lines (all severities) for these CRI namespaces.
fluentbit_kube_full_namespaces:
  - falco
  - logging
  - kube-system
# Lua safety net for non-allowlist: false = drop info. Allowlist ns always keep info.
# Expect 10–100× ES volume vs error-only if gate is off; ILM still elasticsearch_ilm_delete_after (7d).
fluentbit_index_info_logs: true
fluentbit_host_syslog_tail: true
fluentbit_host_syslog_paths: "/var/log/messages,/var/log/syslog"
# Poison ES bulk must not retry forever (False = unlimited). Trace_Error logs HTTP body.
fluentbit_es_retry_limit: 5
fluentbit_es_trace_error: true
# fluentbit_suppress_calico_audit_webhook_noise — see Upstream workarounds
# elastic_logger — see 620_elasticsearch

