opencost_namespace: opencost
opencost_chart_version: "2.5.30"
opencost_chart_state: present

# --- 960_oauth2_proxy ---
oauth2_proxy_namespace: oauth2-proxy
oauth2_proxy_chart_version: ""
oauth2_proxy_chart_state: present
# oauth2_proxy_cookie_secret → atlas-k8s-addons.secrets.yml
# envoy_gateway_oidc_client_secret → atlas-k8s-addons.secrets.yml
# oauth2_host, oauth2_callback_url, oauth2_signout_url, oidc_issuer_url — see 560_apply_ingress
# oauth2_proxy_client_secret — see 930_keycloak_realm

# --- 961_apply_oidc_ingress ---
# HTTPRoute + Envoy SecurityPolicy for k8s_ingress_apps with oidc_auth.
# No extra knobs; runs after 960, independent of oauth2_proxy_chart_state.

# --- 970_consul ---
vault_namespace: vault
consul_chart_version: ""
consul_chart_state: present
consul_server_replicas: 3
# Consul is Vault KV storage (server-only). connectInject/client stay off.

# --- 971_vault ---
vault_ha_replicas: 3  # 1 = standalone (vault-0); N>1 = HA StatefulSet
vault_chart_version: ""
vault_chart_state: present
vault_admin: vault-admin
# vault_admin_password → atlas-k8s-addons.secrets.yml
# vault_oidc_client_secret → atlas-k8s-addons.secrets.yml (Keycloak client vault)
# OIDC login: Keycloak group vault-admins. userpass {{ vault_admin }} remains break-glass.
# Unseal keys SoT: /root/vault-init-keys.txt on k8s_masters via SSH plays
# (chmod 600). Controller-state is a cache, not SoT.
# Helm 4 upgrade --install uses --take-ownership --force-conflicts (SSA vs
# vault-k8s on MutatingWebhookConfiguration caBundle). Do not delete the webhook.
# (ingress in 971_vault/templates/vault.yaml.j2)

# --- 973_openbao ---
# Chart openbao/openbao 0.29.3. Separate namespace from Vault.
# HA uses integrated Raft (PVC /openbao/data), not Consul. One replica uses file storage.
openbao_namespace: openbao
openbao_ha_replicas: 3  # 1 = standalone file (openbao-0); N>1 = HA Raft StatefulSet
openbao_chart_version: "0.29.3"
openbao_chart_state: present
openbao_admin: openbao-admin
# openbao_admin_password → atlas-k8s-addons.secrets.yml
# openbao_oidc_client_secret → atlas-k8s-addons.secrets.yml (Keycloak client openbao)
# OIDC login: Keycloak group openbao-admins. userpass {{ openbao_admin }} remains break-glass.
# Unseal keys SoT: /root/openbao-init-keys.txt on k8s_masters via SSH plays
# (chmod 600). Controller-state is a cache, not SoT.
# (ingress in 973_openbao/templates/openbao.yaml.j2)

# --- 972_external_secrets ---
# Pin: ClusterSecretStore apiVersion external-secrets.io/v1 (chart 0.20.x, k8s ≥1.30).
external_secrets_chart_version: "0.20.4"
external_secrets_chart_state: present

# --- 990_rook_ceph_dashboard ---
ceph_dashboard: admin
# ceph_dashboard_password → atlas-k8s-addons.secrets.yml

# --- 992_kibana_dashboards ---
kibana_dashboard: admin
# kibana_elastic_password — see 640_kibana
kibana_logs_system_namespaces:
  - kube-system
  - calico-system
  - istio-system
  - envoy-gateway-system
  - monitoring
  - logging
  - rook-ceph
  - rook-ceph-cluster
  - falco
  - kyverno
  - vault
  - cert-manager
  - keycloak
  - argocd
  - kiali-operator
  - chaos-mesh
  - policy-reporter
  - metallb-system
  - oauth2-proxy
  - external-dns
  - argo-rollouts
  - cnpg-system
  - trivy-system
  - opencost
kibana_alert_ns_error_threshold: 200
kibana_alert_apiserver_error_threshold: 50
kibana_alert_falco_threshold: 50
kibana_alert_ceph_error_threshold: 50

# --- 994_sentry ---
sentry_namespace: sentry
sentry_chart_version: ""
sentry_chart_state: skip

# --- 996_cluster_report ---
# cluster_credentials_file — YAML export path (role 97)
# cluster_credentials_md_file — MD report path (role 97 defaults)
# cluster_credentials_mode: full | summary (summary masks passwords in MD)
# cluster_credentials_collect_runtime: true — read live secrets from cluster (kubectl)
# cluster_credentials_include_infra: true — include BIND/repos notes in MD/YAML
cluster_credentials_include_infra: true
cluster_credentials_file: "{{ controller_reports_dir }}/cluster-credentials.yaml"
cluster_credentials_md_file: "{{ controller_reports_dir }}/cluster-credentials.md"

# sentry_smtp_password → atlas-k8s-addons.secrets.yml
# sentry_admin_password → atlas-k8s-addons.secrets.yml
sentry_mail:
  backend: smtp
  use_tls: true
  host: smtp.example.com
  port: 25
  username: sentry@example.com
  from: sentry@example.com
sentry_admin_email: admin@example.com

# --- optional addons namespaces (ServiceMonitor discovery for prometheus) ---
graylog_namespace: graylog
kubecost_namespace: kubecost
# graylog_root_password → atlas-k8s-addons.secrets.yml

# --- k8s_users: aggregate for role templates (values from sections above) ---
k8s_users:
  grafana: "{{ grafana }}"
  kibana_dashboard: "{{ kibana_dashboard }}"
  elastic_superuser: "{{ elastic_superuser }}"
  elastic_logger: "{{ elastic_logger }}"
  elastic_admin: "{{ elastic_admin }}"
  elastic_jaeger: "{{ elastic_jaeger }}"
  ceph_dashboard: "{{ ceph_dashboard }}"
  vault_admin: "{{ vault_admin }}"
  openbao_admin: "{{ openbao_admin }}"

# --- k8s_secrets: aggregate for role templates (values from sections above) ---
k8s_secrets:
  grafana_admin_password: "{{ grafana_admin_password }}"
  alertmanager_smtp_password: "{{ alertmanager_smtp_password }}"
  keycloak_admin_password: "{{ keycloak_admin_password }}"
  keycloak_oidc_user_password: "{{ keycloak_oidc_user_password }}"
  oauth2_proxy_client_secret: "{{ oauth2_proxy_client_secret }}"
  oauth2_proxy_cookie_secret: "{{ oauth2_proxy_cookie_secret }}"
  envoy_gateway_oidc_client_secret: "{{ envoy_gateway_oidc_client_secret }}"
  vault_oidc_client_secret: "{{ vault_oidc_client_secret }}"
  openbao_oidc_client_secret: "{{ openbao_oidc_client_secret }}"
  argocd_oidc_client_secret: "{{ argocd_oidc_client_secret }}"
  pinniped_supervisor_client_secret: "{{ pinniped_supervisor_client_secret }}"
  mailu_secret_key: "{{ mailu_secret_key }}"
  mailu_initial_password: "{{ mailu_initial_password }}"
  external_dns_tsig_secret: "{{ external_dns_tsig_secret }}"
  external_dns_apex_tsig_secret: "{{ external_dns_apex_tsig_secret }}"
  external_dns_istio_tsig_secret: "{{ external_dns_istio_tsig_secret }}"
  ceph_dashboard_password: "{{ ceph_dashboard_password }}"
  elastic_password: "{{ elastic_password }}"
  elastic_cert_password: "{{ elastic_cert_password }}"
  elastic_logger_password: "{{ elastic_logger_password }}"
  elastic_admin_password: "{{ elastic_admin_password }}"
  elastic_jaeger_password: "{{ elastic_jaeger_password }}"
  kibana_elastic_password: "{{ kibana_elastic_password }}"
  kibana_encryption_key: "{{ kibana_encryption_key }}"
  argocd_admin_password_bcrypt: "{{ argocd_admin_password_bcrypt }}"
  sentry_smtp_password: "{{ sentry_smtp_password }}"
  sentry_admin_password: "{{ sentry_admin_password }}"
  graylog_root_password: "{{ graylog_root_password }}"
  vault_admin_password: "{{ vault_admin_password }}"
  openbao_admin_password: "{{ openbao_admin_password }}"
