# --- 910_cloudnative_pg ---
cnpg_operator_namespace: cnpg-system
cnpg_cluster_namespace: cnpg
cnpg_cluster_name: postgres
cnpg_cluster_instances: 1
cnpg_cluster_storage: 8Gi
cnpg_chart_version: "0.29.0"
cnpg_chart_state: present

# --- 962_headlamp ---
headlamp_namespace: headlamp
headlamp_chart_version: "0.44.0"
headlamp_chart_state: present

keycloak_namespace: keycloak
keycloak_chart_version: "7.2.2"
keycloak_chart_state: present
keycloak_cnpg_cluster_name: keycloak-pg
keycloak_cnpg_instances: 1
keycloak_cnpg_storage: 8Gi
# keycloak_admin_password → atlas-k8s-addons.secrets.yml
# keycloak_realm, keycloak_host, keycloak_url — see 560_apply_ingress

# --- 930_keycloak_realm ---
# keycloak_tf_workspace — controller-state/staging/keycloak-realm
# keycloak_tf_plugin_dir — local plugin mirror (lab: /usr/local/share/terraform/plugins)
# keycloak_tf_provider_version — pin shared with roles/930_keycloak_realm/templates/main.tf.j2
# Realm OIDC test user (Envoy X-Auth-Request-Email / Mailu proxyAuth). Distinct
# from Mailu initialAccount admin@ and from Keycloak master admin.
keycloak_oidc_username: admin
keycloak_oidc_user_email: "admin-oidc@{{ dns_domain_suffix }}"
keycloak_oidc_user_first_name: Admin
keycloak_oidc_user_last_name: OIDC
# keycloak_oidc_user_password → atlas-k8s-addons.secrets.yml
# oauth2_proxy_client_secret → atlas-k8s-addons.secrets.yml
# envoy_gateway_oidc_client_secret → atlas-k8s-addons.secrets.yml
# vault_oidc_client_secret → atlas-k8s-addons.secrets.yml
# argocd_oidc_client_secret → atlas-k8s-addons.secrets.yml

# --- 940_apiserver_oidc ---
# kube-apiserver JWT after Keycloak exists. Off in sibling catalog (no IdP on
# standalone addons). Leaf overlay sets kube_apiserver_oidc_enabled: true only —
# do not copy kube_oidc_* onto the leaf (extra-vars overlay is the SoT;
# 130_validate_vars loads these defaults and binds issuer from oidc_issuer_url).
# Do not enable at kubeadm init. Runs after 930, before 941 kubeconfig.oidc.
kube_apiserver_oidc_enabled: false
kube_oidc_client_id: kubernetes
kube_oidc_username_claim: preferred_username
kube_oidc_username_prefix: "-"
kube_oidc_groups_claim: groups
kube_oidc_ca_file: /etc/kubernetes/pki/oidc-ca.crt
kube_oidc_issuer_url: "{{ oidc_issuer_url | default('') }}"
kube_oidc_kubeadm_config: /etc/kubernetes/kubeadm-oidc.yaml

# --- 941_k8s_oidc ---
# Public Keycloak client kubernetes + group k8s-admins (71). No client secret.
# kubeconfig: {{ controller_kubeconfig }}.oidc (kubectl oidc-login / kubelogin).
# Runs after 940 so the API already has OIDC flags. Controller stays on admin.conf;
# install kubectl-oidc_login on the client PATH. Gated by kube_apiserver_oidc_enabled.
k8s_oidc_group: k8s-admins
k8s_oidc_clusterrolebinding: oidc-k8s-admins

# --- 942_pinniped ---
# Supervisor + Concierge (official YAML in roles/942_pinniped/chart, not Bitnami).
# Keycloak is the upstream IdP (confidential client pinniped-supervisor).
# 81/79 stay as kubelogin break-glass. Controller writes ….pinniped via pinniped CLI.
# Download UI: https://pinniped-login.<cluster> (Envoy OIDC, same as Headlamp).
pinniped_chart_state: present
pinniped_chart_version: ""
pinniped_version: v0.47.0
pinniped_namespace: pinniped
pinniped_supervisor_service: pinniped-supervisor
pinniped_https_secret: pinniped-supervisor-https
pinniped_oidc_client_id: pinniped-supervisor
pinniped_oidc_client_secret_name: pinniped-supervisor-oidc-client
pinniped_idp_name: keycloak
pinniped_jwtauthenticator: supervisor
pinniped_kubeconfig: "{{ controller_kubeconfig }}.pinniped"
pinniped_login_service: pinniped-login
pinniped_login_kubeconfig_secret: pinniped-login-kubeconfig
pinniped_login_image: nginx:1.27-alpine
# pinniped_host / pinniped_login_host — see 560_apply_ingress
# pinniped_supervisor_client_secret → atlas-k8s-addons.secrets.yml

# --- 950_mailu ---
# Official chart mailu/mailu. No native OIDC: Envoy SecurityPolicy (72) + proxyAuth.
# Web: mailu_host HTTPRoute :80 (TLS_FLAVOR=mail; Envoy terminates TLS). SMTP/IMAP: mailu_mx_host A on MetalLB.
# MX {{ mailu_domain }} → mailu_mx_host via 42 external-dns-apex (DNSEndpoint). IMAP/SMTP stay password / app token.
# sessionTimeout = permanentSessionLifetime (30d): webmail IMAP token follows Flask Redis session.
# admin dnsPolicy None → mailu-unbound (DNSSEC AD). Pinned ClusterIP, no hostAliases.
mailu_namespace: mailu
mailu_chart_version: "2.7.3"
mailu_chart_state: present
mailu_domain: "{{ dns_domain_suffix }}"
mailu_lb_ip: ""
mailu_clamav_enabled: true
mailu_initial_username: admin
mailu_https_secret: mailu-tls
mailu_secret_name: mailu-secret
mailu_unbound_cluster_ip: 10.0.0.53
mailu_unbound_image: ghcr.io/mailu/unbound:2024.06.55
# mailu_host / mailu_mx_host — see 560_apply_ingress
# mailu_secret_key / mailu_initial_password → atlas-k8s-addons.secrets.yml

# --- 840_trivy ---
# Chart aquasecurity/trivy-operator. No UI; CR reports + Prometheus/Grafana (gnet 17813, 16337).
# Scans kube-system only. Play: after 830_policy_reporter, before 910_cloudnative_pg.
trivy_namespace: trivy-system
trivy_chart_version: "0.36.0"
trivy_chart_state: present

# --- 954_opencost ---
# Chart opencost/opencost. UI via Envoy OIDC (961); chart Ingress/HTTPRoute off.
