keycloak_realm: atlas
falco_host: "falco.{{ k8s_cluster_domain }}"
jaeger_host: "jaeger.{{ k8s_cluster_domain }}"
kiali_host: "kiali.{{ k8s_cluster_domain }}"
headlamp_host: "headlamp.{{ k8s_cluster_domain }}"
policy_reporter_host: "policy-reporter.{{ k8s_cluster_domain }}"
prometheus_host: "prometheus.{{ k8s_cluster_domain }}"
alertmanager_host: "alertmanager.{{ k8s_cluster_domain }}"
grafana_host: "k8s-grafana.{{ k8s_cluster_domain }}"
rook_host: "rook.{{ k8s_cluster_domain }}"
argocd_host: "argo.{{ k8s_cluster_domain }}"
argo_rollouts_host: "rollouts.{{ k8s_cluster_domain }}"
vault_host: "vault.{{ k8s_cluster_domain }}"
openbao_host: "openbao.{{ k8s_cluster_domain }}"
chaos_mesh_host: "chaos-mesh.{{ k8s_cluster_domain }}"
opencost_host: "opencost.{{ k8s_cluster_domain }}"
pinniped_host: "pinniped.{{ k8s_cluster_domain }}"
pinniped_login_host: "pinniped-login.{{ k8s_cluster_domain }}"
mailu_host: "mail.{{ k8s_cluster_domain }}"
mailu_mx_host: "smtp.{{ k8s_cluster_domain }}"
blackbox_host: "blackbox.{{ k8s_cluster_domain }}"
keycloak_host: "keycloak.{{ k8s_cluster_domain }}"
keycloak_url: "https://{{ keycloak_host }}"
oidc_issuer_url: "{{ keycloak_url }}/auth/realms/{{ keycloak_realm }}"
oauth2_host: "oauth2.{{ k8s_cluster_domain }}"
oauth2_callback_url: "https://{{ oauth2_host }}/oauth2/callback"
oauth2_signout_url: "https://{{ oauth2_host }}/oauth2/sign_out"
elasticsearch_host: "elasticsearch.{{ k8s_cluster_domain }}"
kibana_host: "kibana.{{ k8s_cluster_domain }}"
