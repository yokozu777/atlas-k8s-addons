[defaults]
filter_plugins = ./filter_plugins
host_key_checking = false
forks = 50
interpreter_python = auto
callbacks_enabled = timer, profile_tasks, profile_roles
gather_facts = false
gathering = explicit
roles_path = roles

[ssh_connection]
pipelining = true
ssh_args = -C -o ControlMaster=auto -o ControlPersist=30m
